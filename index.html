<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SANGHX • Delivery</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

<style>
:root {
  --saffron: #FF4B3A; /* Changed back to Brand Red */
  --white: #FFFFFF;
  --green: #10B981;   /* Standard Green */
  --navy: #000080;
  --dark-bg: #050505;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Outfit', sans-serif;
}

body {
  background: var(--dark-bg);
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  perspective: 1000px;
}

/* ================= SPLASH ================= */

.splash-container {
  position: relative;
  width: 100%;
  height: 100%;
  /* Zoom through effect into the app */
  animation: zoomThrough 4s cubic-bezier(0.7,0,0.3,1) forwards;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* ================= GLOWS ================= */

.glow {
  position: absolute;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(255, 75, 58, 0.2) 0%, transparent 70%);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 0;
  animation: pulse 2s infinite alternate;
}

@keyframes pulse {
  from { opacity: 0.5; transform: translate(-50%, -50%) scale(0.8); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
}

/* ================= LOGO ================= */

.logo-text {
  font-size: 80px;
  font-weight: 900;
  letter-spacing: -3px;
  display: flex;
  gap: 2px;
  opacity: 0;
  color: var(--white);
  animation: fadeIn 1s ease forwards 0.5s; 
  z-index: 10;
  position: relative;
}

.logo-text span {
  color: var(--saffron); /* Brand Highlight */
}

.tagline {
  margin-top: 20px;
  font-size: 14px;
  letter-spacing: 8px;
  font-weight: 700;
  color: #888;
  opacity: 0;
  text-transform: uppercase;
  animation: fadeIn 1s ease forwards 1.2s;
  z-index: 10;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ================= ZOOM ================= */

@keyframes zoomThrough {
  0% { transform: scale(1); }
  75% { transform: scale(1); }
  100% { transform: scale(60); opacity: 0; }
}
</style>
</head>

<body>

<div class="splash-container">

  <div class="glow"></div>

  <div class="logo-text">
    SAN<span>GHX</span>
  </div>

  <div class="tagline">FASTEST DELIVERY</div>

</div>

<script>
// Redirect logic matching the animation timing
setTimeout(() => {
  document.body.style.background = "#fff"; // Flash white for smooth transition
  window.location.href = "page2.html";
}, 3800);
</script>

</body>
</html>
